name: Deploy built folder over SSH
description: Uploads an already built and tested folder to a remote release directory and switches a symlink to it. It does not install, build or test anything.
inputs:
  host:
    description: Server hostname or IP.
    required: true
  user:
    description: SSH user.
    required: true
  path:
    description: Remote project folder, for example /var/www/donatr.eu.
    required: true
  source:
    description: Local folder with the built output to deploy.
    required: true
  ssh-key:
    description: Private SSH key for the deploy user.
    required: true
  known-hosts:
    description: Pinned host key lines, from ssh-keyscan.
    required: true
  port:
    description: SSH port.
    default: "22"
  link:
    description: Name of the symlink pointing at the active release. Releases are named <link>.<timestamp>.
    default: build
  keep:
    description: Number of releases to keep, including the active one.
    default: "5"
  owner:
    description: Optional user:group to chown the new release to (needs root or passwordless sudo).
    default: ""
  pre-activate:
    description: Optional command run on the server inside the new release before it goes live. A non-zero exit aborts the deploy and removes the release.
    default: ""
  health-url:
    description: Optional URL checked from the runner after the switch. If it never returns a 2xx, the deploy fails (and rolls back).
    default: ""
  health-retries:
    description: Number of health check attempts, 3 seconds apart.
    default: "10"
  rollback-on-failure:
    description: Point the symlink back at the previous release when the health check fails.
    default: "true"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        INPUT_HOST: ${{ inputs.host }}
        INPUT_USER: ${{ inputs.user }}
        INPUT_PORT: ${{ inputs.port }}
        INPUT_KEY: ${{ inputs.ssh-key }}
        INPUT_KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: ${{ github.action_path }}/ssh-setup.sh
    - shell: bash
      env:
        DEPLOY_TARGET: deploy-target
        DEPLOY_PATH: ${{ inputs.path }}
        DEPLOY_SOURCE: ${{ inputs.source }}
        DEPLOY_LINK: ${{ inputs.link }}
        DEPLOY_KEEP: ${{ inputs.keep }}
        DEPLOY_OWNER: ${{ inputs.owner }}
        DEPLOY_PRE_ACTIVATE: ${{ inputs.pre-activate }}
        DEPLOY_HEALTH_URL: ${{ inputs.health-url }}
        DEPLOY_HEALTH_RETRIES: ${{ inputs.health-retries }}
        DEPLOY_ROLLBACK_ON_FAILURE: ${{ inputs.rollback-on-failure }}
        DEPLOY_SHA: ${{ github.sha }}
        DEPLOY_ACTOR: ${{ github.actor }}
        DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: ${{ github.action_path }}/deploy.sh
    - if: always()
      shell: bash
      run: rm -f ~/.ssh/deploy_key
